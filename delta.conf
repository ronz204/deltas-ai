# Settings of delta in this project. Everything here is optional: a missing key means delta's default.
# One key=value per line; blank lines and lines starting with # are ignored.

# Which files are tests: patterns on the file name (as in path.Match), separated by commas.
# They replace delta's own rule, so list every convention the project uses. A Markdown file is never a test.
# test_files=*_test.go,*.test.ts

# The longest a claim's command may run, such as 90s or 10m.
# command_timeout=10m

# Programs that must be on the PATH; delta status warns about the ones that are missing.
# required_tools=git,go

# What a slice depends on. Without a line here a slice depends on every code file, and the Stop hook asks
# for a new delta check whenever any of them changes. Naming paths narrows that to those paths.
# scope.billing=billing,shared/money

# Context budgets of the Claude Code knowledge base, read by delta budget and by budget.sh in the archivist
# skill. One ceiling per key; a missing key or 0 means no ceiling.
# Keys are <kind>_<metric>. Sizes are lines or characters; tokens are estimates, at about
# 3.3 characters per token (calibrated against Claude Code's /context report).
#
# Classes, by how often the content is loaded:
#   always  every turn (CLAUDE.md, rules without paths, skill and agent descriptions)
#   scoped  when a file matching the rule's paths is read
#   invoke  when the skill or agent is invoked
#   demand  only when something reads it (docs, references, specs, designs)

# always
always_tokens=3500
claude_lines=80
rule_always_lines=50
skill_desc_chars=1024
agent_desc_chars=1024

# scoped
rule_scoped_lines=80

# invoke
skill_body_lines=150
agent_body_lines=100

# demand
doc_lines=200
reference_lines=150
# shortcut: sized to the two largest catalog entries (rule and rationale share a file); lower it once their rationale is split out
reference_chars=14000
