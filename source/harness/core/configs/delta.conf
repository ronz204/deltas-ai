# What a test file is: patterns on the file name. They replace delta's own rule.
test_files=*_test.go,test_*.py,*_test.py,*.test.*,*.spec.*

# The longest a claim's command may run.
command_timeout=10m

# Programs that must be on the PATH.
required_tools=

# What a slice depends on. Without a line here it is every code file.
# Example: scope.billing=billing,shared/money


# Context budget: lines, characters or tokens; 0 means no ceiling.

# always: loaded every turn
always_tokens=3500
claude_lines=80
rule_always_lines=50
skill_desc_chars=1024
agent_desc_chars=1024

# scoped: loaded when a file matching the rule's paths is read
rule_scoped_lines=80

# invoke: loaded when the skill or agent is invoked
skill_body_lines=150
agent_body_lines=100

# demand: loaded only when something reads it
doc_lines=200
reference_lines=150
reference_chars=14000
