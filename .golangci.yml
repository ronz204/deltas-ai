version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    paths:
      - testdata

formatters:
  enable:
    - gofmt
