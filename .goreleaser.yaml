version: 2

project_name: delta

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: delta
    main: ./cmd/delta
    binary: delta
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: delta
    formats: [tar.gz]
    name_template: "delta_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md
      - MANUAL.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^test"

release:
  draft: false
  prerelease: auto
