# Which files are tests: patterns on the file name.
match=*_test.go,test_*.py,*_test.py,*.test.*,*.spec.*
# Folders never searched for tests.
skip=.git,node_modules,vendor
# Files that never count as a slice's code: patterns on the file name, or on the path when they hold a /.
# A folder ends in /**. Binary files never count either. Setting it replaces the defaults.
ignore=go.sum,package-lock.json,npm-shrinkwrap.json,yarn.lock,pnpm-lock.yaml,bun.lockb,Cargo.lock,poetry.lock,Pipfile.lock,uv.lock,composer.lock,Gemfile.lock
