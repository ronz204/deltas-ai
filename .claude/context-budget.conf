# Context budgets for this project's Claude Code knowledge base.
# Read by the budget script bundled with the archivist skill. One ceiling per key;
# a missing key or a value of 0 means "no ceiling". Sizes are lines or characters;
# tokens are only ever estimated (characters / 4).
#
# Classes, by how often the content is loaded:
#   always    every turn (CLAUDE.md, rules without paths, skill and agent descriptions)
#   scoped    whenever a file matching the rule's paths is read
#   invoke    when the skill or agent is invoked
#   demand    only when something reads it (docs, references, specs, designs)

# always
always_total_tokens=2500
claude_md_lines=80
rule_always_lines=40
skill_description_chars=1024
agent_description_chars=1024

# scoped
rule_scoped_lines=80

# invoke
skill_body_lines=150
agent_body_lines=100

# demand
doc_lines=200
reference_lines=150
spec_lines=120
design_lines=120
