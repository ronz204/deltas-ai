# Context budgets for this project's Claude Code knowledge base, read by budget.sh in
# the archivist skill. One ceiling per key; a missing key or 0 means no ceiling.
# Keys are <kind>_<metric>. Sizes are lines or characters; tokens are estimates, at about
# 3.3 characters per token (calibrated against Claude Code's /context report).
#
# Classes, by how often the content is loaded:
#   always  every turn (CLAUDE.md, rules without paths, skill and agent descriptions)
#   scoped  when a file matching the rule's paths is read
#   invoke  when the skill or agent is invoked
#   demand  only when something reads it (docs, references, specs, designs)

# always
always_tokens=3500
claude_lines=80
rule_always_lines=40
skill_desc_chars=1024
agent_desc_chars=1024

# scoped
rule_scoped_lines=80

# invoke
skill_body_lines=150
agent_body_lines=100

# demand
doc_lines=200
reference_lines=150
spec_lines=120
design_lines=120
